          - JSON.parse 可以解析。
          - 可以直接保存为 `.canvas` 文件。
          - Obsidian Canvas 可以直接打开。
          # Canvas Schema
          ## Text Node
          只能使用：
          {
            "id": "node_1",
            "type": "text",
            "text": "内容",
            "x": 0,
            "y": 0,
            "width": 300,
            "height": 150,
            "color": "1"
          }
          允许字段：
          - id
          - type
          - text
          - x
          - y
          - width
          - height
          - color
          禁止：
          - label
          - children
          - parent
          - groupId
          - metadata
          ---
          ## Group Node
          只能使用：
          {
            "id": "group_1",
            "type": "group",
            "label": "📦 分类名称",
            "x": 0,
            "y": 0,
            "width": 600,
            "height": 500,
            "color": "2"
          }
          允许字段：
          - id
          - type
          - label
          - x
          - y
          - width
          - height
          - color
          禁止：
          - text
          - children
          - nodes
          ---
          ## Edge
          只能使用：
          {
            "id": "edge_1",
            "fromNode": "node_1",
            "fromSide": "bottom",
            "toNode": "node_2",
            "toSide": "top",
            "color": "1"
          }
          允许字段：
          - id
          - fromNode
          - fromSide
          - toNode
          - toSide
          - color
          禁止：
          - label
          - relation
          - description
          # Core Knowledge Model
          Canvas 使用树状知识结构。
          核心结构：
          ```
          主题入口
          ↓
          一级知识领域
          ↓
          二级知识分类
          ↓
          核心概念
          ↓
          细节机制
          ↓
          使用方式
          ```
          空间表达：
          ```
          上层 = 抽象概念
          下层 = 具体细节
          左侧 = 一个分支
          右侧 = 另一个并列分支
          ```
          不要生成：
          ```
          所有节点平铺
          ```
          不要生成：
          ```
          无层级关系的知识列表
          ```
          # Knowledge Planning Rules
          生成前必须内部规划：
          1. 当前主题是什么。
          2. 一级知识领域有哪些。
          3. 每个领域下面有哪些子领域。
          4. 每个知识点属于哪个父节点。
          5. 哪些知识属于核心。
          6. 哪些知识属于细节。
          7. 哪些内容应该合并。
          最终输出必须体现规划后的树结构。
          # Entry Node Rules
          每个 Canvas 必须有一个入口 Node。
          入口 Node：
          位置：
          顶部中心。
          内容：
          第一行：
          Emoji + 主题名称
          第二行：
          主题定义。
          第三行：
          核心价值。
          示例：
          ```
          📦 pnpm
          现代 JavaScript 包管理器
          通过 Store 和链接机制优化依赖管理
          ```
          颜色：
          "1"
          # Tree Structure Rules
          知识结构必须符合父子关系。
          父节点：
          表示范围。
          子节点：
          表示组成。
          例如：
          正确：
          ```
          📦 pnpm
          ├── 依赖存储
          │   ├── Store
          │   └── Hard Link
          │
          ├── node_modules
          │   ├── .pnpm
          │   └── Symlink
          ```
          错误：
          ```
          pnpm
          ├── Store
          ├── Hard Link
          ├── install
          ├── Workspace
          ```
          因为缺少中间抽象层。
          # Group Rules
          Group 表示一级知识领域。
          适合：
          ```
          📦 依赖存储机制
          包含：
          Store
          Hard Link
          Symlink
          ```
          不适合：
          ```
          📦 命令
          ```
          Group 必须：
          - 表示明确领域。
          - 包含多个相关节点。
          - 形成知识模块。
          # Group Hierarchy Rules
          Group 只能表示较高层分类。
          不要：
          ```
          pnpm
          Group:
          Hard Link
          ```
          应该：
          ```
          pnpm
          Group:
          依赖链接机制
          Node:
          Hard Link
          ```
          Group 不应该替代 Node。
          # Node Tree Rules
          Node 用于表达树中的知识点。
          一个 Node：
          只表达一个概念。
          Node 层级：
          ```
          核心概念
          ↓
          组成部分
          ↓
          实现细节
          ↓
          示例
          ```
          例如：
          ```
          ⚙️ 依赖解析
          ├── 版本选择
          ├── Lockfile
          └── Resolution
          ```
          不要：
          ```
          Lockfile 和 Resolution
          ```
          # Concept Analysis Rules
          每个重要 Node 内部必须体现逻辑分析。
          Node 文本结构：
          第一行：
          Emoji + 概念名称
          第二行：
          是什么
          第三行：
          作用
          第四行：
          关键机制或关系
          示例：
          ```
          🔗 Hard Link
          多个路径共享同一文件数据
          减少 Package 重复存储
          pnpm 用于连接 Store 内容
          ```
          不要只写：
          ```
          Hard Link 是一种链接。
          ```
          # Knowledge Layer Rules
          每个分支按照：
          ```
          是什么
          ↓
          为什么存在
          ↓
          如何工作
          ↓
          如何使用
          ↓
          限制
          ```
          展开。
          例如：
          ```
          Workspace
          ├── 是什么
          ├── 包含哪些组成
          ├── 如何关联 Package
          ├── 如何配置
          └── 使用限制
          ```
          # Abstraction Rules
          知识粒度必须处于理解层。
          禁止：
          过细：
          ```
          函数参数
          API字段
          单个命令参数
          ```
          禁止：
          过粗：
          ```
          所有功能
          ```
          优先：
          ```
          设计思想
          ↓
          核心机制
          ↓
          实现方式
          ↓
          具体操作
          ```
          # Tree Depth Rules
          控制树深度。
          推荐：
          3-5 层。
          例如：
          ```
          主题
          ↓
          领域
          ↓
          机制
          ↓
          概念
          ↓
          细节
          ```
          禁止：
          超过 6 层。
          如果层级过深：
          创建新的 Group。
          # Layout Rules
          Canvas 使用树状布局。
          固定规则：
          入口：
          顶部。
          一级 Group：
          横向排列。
          Group 内节点：
          纵向展开。
          示例：
          ```
                          🌐主题
                  📦领域A      ⚙领域B
                    |           |
                Node Node   Node Node
                      |
                    Detail
          ```
          禁止：
          随机布局。
          # Group Containment Rules
          Group 与 Node 通过坐标关系绑定。
          Node 必须完全位于 Group 内。
          必须满足：
          group.x <= node.x
          group.y <= node.y
          并且：
          node.x + node.width <= group.x + group.width
          node.y + node.height <= group.y + group.height
          禁止：
          Node 超出 Group。
          # Edge Rules
          Edge 不是主要结构。
          树结构主要通过：
          - Group。
          - 坐标。
          - 层级。
          表达。
          Edge 只用于：
          - 执行流程。
          - 生命周期。
          - 数据流。
          例如：
          ```
          源码
          ↓
          编译
          ↓
          产物
          ```
          禁止：
          概念之间全部连接。
          # Edge Limit
          限制：
          小主题：
          <=5
          中主题：
          <=10
          大型主题：
          <=20
          超过：
          删除 Edge。
          # Emoji Rules
          Emoji 用于增强树结构识别。
          规则：
          - 只允许出现在 text 和 label。
          - 每个节点最多一个。
          - 不替代文字。
          推荐：
          主题：
          🌐 📚 🚀
          领域：
          📦 🏗️ ⚙️
          机制：
          🔄
          配置：
          🛠️
          命令：
          ⌨️
          限制：
          ⚠️
          结果：
          ✅
          # Color Rules
          只能使用：
          "1"
          入口和核心节点
          "2"
          Group
          "3"
          机制节点
          "4"
          子分支
          "5"
          限制
          "6"
          结果
          # Density Rules
          Canvas 必须保持可读。
          小主题：
          - 入口 1
          - Group 2-5
          - Node 5-20
          中主题：
          - Group 4-8
          - Node 20-50
          大型主题：
          拆分：
          Overview Canvas
          +
          Detail Canvas
          # Simplification Rules
          生成前删除：
          - 重复知识。
          - 平级重复概念。
          - 无意义节点。
          - 聊天过程。
          - 过度展开细节。
          原则：
          一个知识点只出现一次。
          # Accuracy Rules
          必须：
          1. 后续修正覆盖旧内容。
          2. 删除错误信息。
          3. 不保留猜测。
          4. 保持技术名称准确。
          5. 保持流程真实。
          # ID Rules
          必须唯一递增。
          Node：
          node_1
          node_2
          Group：
          group_1
          group_2
          Edge：
          edge_1
          edge_2
          # Final Validation
          输出前检查：
          JSON：
          - 是否只有 nodes 和 edges。
          - 是否可以解析。
          - 是否没有额外字段。
          结构：
          - 是否存在入口节点。
          - 是否形成树状结构。
          - 是否存在明确 Group。
          - 是否每个 Node 有父级逻辑。
          - 是否知识点按照抽象层展开。
          - 是否每个分组内部有细节分析。
          - 是否避免平铺。
          - 是否避免蜘蛛网连接。
          - 是否 Emoji 使用合理。
          - 是否可以直接导入 Obsidian Canvas。
          最终只输出合法 JSON。
      ```

