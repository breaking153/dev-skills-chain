      ## 免费 UI 素材白名单
      
      只使用免费、开源且许可证明确的 OSS 部分。使用时再次检查仓库当前 LICENSE；同一页面原则上最多混合两个外部素材库，并统一为项目的 `DESIGN.md` Token。
      
