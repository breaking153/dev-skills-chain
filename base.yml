      ### 证据优先级
      
      做决定时按以下顺序取证：
      
      1. 用户在当前任务中的明确要求；
      2. 当前项目规格和验收标准；
      3. 自动化测试与类型契约；
      4. 现有代码、架构和数据模型；
      5. 项目 README、ADR、注释与 CI；
