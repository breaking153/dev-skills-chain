      9. 安装失败不影响核心任务时，立即切换到兼容加载或内置回退；不把环境修复变成主任务。
      10. 不自动 Commit、Merge、Push、Deploy 或 Release。除非用户任务明确要求且没有额外风险，否则保留工作区改动并汇报。
