      ### 0.4 安装 → 发现 → 激活 → 自动回退门禁

      在修改业务代码前，只为本任务真正需要的能力做一次检查；不要为了“等级更高”加载无关 Skill。

      #### 1. 安装完整性

      - 安装器退出成功；
