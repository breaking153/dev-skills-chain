      Skill 必须区分四种状态：

      - **原生活跃**：当前请求已由 Harness 加载完整 Skill 指令，并且其所需运行时能力真实可用。
      - **已安装待重载**：文件已经安装，但当前请求没有重新构建上下文；只供下一次请求或新会话使用。
      - **兼容加载**：当前轮直接读取可信来源的 `SKILL.md`、引用文件或 `npx skills use` 输出，并手工执行纯指令流程；不等同于原生激活。
