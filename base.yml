      ### 条件独立供应链审查

      当本次 change 新增多个依赖、引入高权限前端 SDK、身份/支付 SDK 或不熟悉的构建插件时，可选 Trail of Bits `supply-chain-risk-auditor`。官方来源：<https://github.com/trailofbits/skills>，CC-BY-SA-4.0。

